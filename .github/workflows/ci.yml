name: CI

on:
  pull_request:
    branches:
      - main
      - prod
  push:
    branches:
      - main
      - prod

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          npx playwright install --with-deps chromium

      - name: Run model-free repository gate
        run: npm run verify

      - name: Run browser integration suite with real rendering
        run: npm run test:browser
